<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Hub - Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <nav>
            <div class="brand">
                <a href="index.html" class="logo"><img src="images/logo.png" alt="PhoneHub"></a>
                <h1 class="nav-title"><span class="phone">Phone </span><span class="hub"><span class="hub-box">Hub</span></span></h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contact Section -->
    <section class="contact-section">
        <div class="body-container">
            <div class="contact-us">
                <h2>Contact Us</h2>
                <p>Email: <a href="mailto:support@phonehub.com">support@phonehub.com</a></p>
                <p>Phone: <a href="tel:+1234567890">+123 456 7890</a></p>
                
                <!-- Optional: Add a contact form -->
                <form action="#" method="post" class="contact-form">
                    <input type="text" name="name" placeholder="Your Name" required>
                    <input type="email" name="email" placeholder="Your Email" required>
                    <textarea name="message" placeholder="Your Message" required></textarea>
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer Section -->
<footer class="footer">
    <div class="footer-container">
        <p>&copy; 2025 PhoneHub. All Rights Reserved.</p>
        </div>
    </div>
</footer>


</body>
</html>
